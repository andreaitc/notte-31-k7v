<!doctype html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="President?">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Where in the World Is the President?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: una sola videata 16:9 in orizzontale, come un cabinato. Scena a tutto schermo, HUD negli angoli, finestre sovrapposte per dialoghi, oggetti e mappa. Look unico notturno, per scelta. */
:root{
  color-scheme:dark;
  --buio:#0b0f2a; --pannello:#141a44; --pannello2:#1b2358; --linea:#3b48a8;
  --ciano:#5ee6ff; --giallo:#ffd23c; --rosso:#ff3b5c; --bianco:#f4f4ff; --tenue:#9aa3e0;
  --pix:"Press Start 2P","Courier New",monospace; --txt:"VT323","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#000;color:var(--bianco);font-family:var(--txt);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid var(--giallo);outline-offset:2px}
.stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
.screen{position:fixed;left:0;right:0;top:var(--st,0px);width:100vw;height:calc(100vh - var(--st,0px));height:calc(100dvh - var(--st,0px));container-type:size;overflow:hidden;background:#05060f;font-size:2vw;font-size:clamp(12px,min(2.1cqw,4.6cqh),28px)}

#cv{position:absolute;left:var(--cx,0);top:var(--cy,0);width:var(--cw,100%);height:var(--ch,100%);image-rendering:pixelated;display:block}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.16) 2px 3px);z-index:50}
.ov{position:absolute;z-index:20}

/* HUD */
.hud{position:absolute;left:1.5%;right:1.5%;top:2%;display:flex;justify-content:space-between;align-items:flex-start;gap:1em;z-index:15;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{background:rgba(11,15,42,.82);border:2px solid var(--linea);padding:.35em .6em;font-family:var(--pix);font-size:.55em;line-height:1.3;color:var(--tenue)}
.chip b{color:var(--giallo);font-weight:400;font-variant-numeric:tabular-nums}
.chip b.late{color:var(--rosso)}
.slots{display:flex;gap:.4em}
.slot{width:2.4em;height:2.4em;display:grid;place-items:center;background:rgba(11,15,42,.82);border:2px dashed var(--linea);font-family:var(--pix);font-size:.55em;color:var(--tenue)}
.slot.on{border:2px solid var(--giallo);background:#3a2a08}
.slot canvas{width:100%;height:100%;image-rendering:pixelated}
.btns{display:flex;gap:.4em}
.hb{background:rgba(11,15,42,.85);border:2px solid var(--linea);padding:.5em .7em;font-family:var(--pix);font-size:.5em;color:var(--bianco)}
.hb:hover{border-color:var(--giallo);color:var(--giallo)}
.hb.big{border-color:var(--giallo);color:var(--giallo);font-size:.6em}
.place{position:absolute;left:1.5%;bottom:3%;z-index:15;font-family:var(--pix);font-size:.55em;color:var(--giallo);background:rgba(11,15,42,.82);border:2px solid var(--linea);padding:.4em .6em;pointer-events:none}
.hint{position:absolute;right:1.5%;bottom:3%;z-index:15;font-family:var(--pix);font-size:.45em;color:var(--tenue);background:rgba(11,15,42,.7);padding:.4em .6em;pointer-events:none}

/* fumetti */
.bub{position:absolute;z-index:12;max-width:38%;background:var(--bianco);color:#111;border:3px solid #111;padding:.35em .6em;font-size:1.05em;line-height:1.05;transform:translate(-50%,-100%);box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.bub::after{content:"";position:absolute;left:50%;bottom:-.75em;width:.8em;height:.8em;background:var(--bianco);border-right:3px solid #111;border-bottom:3px solid #111;transform:translateX(-50%) rotate(45deg)}
.bub.val{background:#fff6c8}
.bub.val::after{background:#fff6c8}
.bub .nm{display:block;font-family:var(--pix);font-size:.45em;color:#6a6a8a;margin-bottom:.3em}
.tap{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);z-index:14;font-family:var(--pix);font-size:.45em;color:var(--bianco);background:rgba(0,0,0,.55);padding:.4em .7em;pointer-events:none}

/* interrogatorio a tutto schermo */
.talk{inset:2.5% 2%;background:var(--pannello);border:4px solid var(--bianco);box-shadow:0 0 0 4px #000,6px 6px 0 4px rgba(0,0,0,.5);display:grid;grid-template-columns:22% minmax(0,1fr);gap:2.5%;padding:2%}
.who{display:flex;flex-direction:column;gap:.5em;min-width:0}
.who canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;border:3px solid var(--ciano);background:#141a44}
.who h3{margin:0;font-family:var(--pix);font-weight:400;font-size:.6em;line-height:1.5;color:var(--ciano)}
.who span{color:var(--tenue);font-size:.9em;line-height:1}
.conv{display:flex;flex-direction:column;gap:.6em;min-width:0;min-height:0}
.say{flex:1;min-height:0;overflow:auto;font-size:1em;line-height:1.06;padding-right:.3em}
.say .q{color:var(--ciano);display:block;margin-bottom:.35em}
.say .th{color:var(--giallo);display:block;margin-top:.4em}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.25em .8em;border-top:2px solid var(--linea);padding-top:.4em}
.ch{display:flex;gap:.5em;align-items:baseline;text-align:left;padding:.15em .2em;font-size:.9em;line-height:.95}
.ch::before{content:"\25B6";color:transparent;font-size:.6em}
.ch:hover,.ch:focus-visible{color:var(--ciano)}
.ch:hover::before,.ch:focus-visible::before{color:var(--ciano)}
.ch span{flex:1}
.ch small{font-family:var(--pix);font-size:.42em;color:var(--giallo);white-space:nowrap}
.ch.done span{color:var(--tenue)}
.ch.exit{color:var(--tenue)}
.ch[disabled]{opacity:.35;pointer-events:none}

/* nota oggetto */
.note{left:3%;right:3%;bottom:4%;background:var(--pannello);border:4px solid var(--bianco);box-shadow:0 0 0 3px #000;padding:.7em 1em;display:flex;gap:1em;align-items:center}
.note .card{flex:none;width:4.2em;height:4.2em;border:3px solid var(--giallo);background:#3a2a08;image-rendering:pixelated}
.note p{margin:0;line-height:1.05}
.note .t1{font-family:var(--pix);font-size:.5em;color:var(--ciano);margin-bottom:.5em;line-height:1.4}
.note .th{color:var(--giallo)}
.note .letter{background:var(--bianco);color:#111;padding:.2em .4em;margin-top:.3em;display:inline-block}
.toast{left:50%;top:1.5%;transform:translateX(-50%);background:var(--rosso);color:#fff;font-family:var(--pix);font-size:.6em;line-height:1.6;padding:.7em 1em;border:3px solid #fff;text-align:center;z-index:30;pointer-events:none;width:max-content;max-width:80%}

/* mappa */
.map{inset:3% 2.5%;background:#0d1a3a;border:4px solid var(--bianco);box-shadow:0 0 0 4px #000;padding:2%;display:flex;flex-direction:column;gap:2%;background-image:linear-gradient(rgba(94,230,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(94,230,255,.07) 1px,transparent 1px);background-size:4% 7.1%}
.maphead{display:flex;justify-content:space-between;align-items:center;font-family:var(--pix);font-size:.6em;color:var(--ciano)}
.plan{flex:1;display:flex;gap:2%;min-height:0}
.bld{flex:2.5;display:flex;flex-direction:column;gap:2%;border:3px solid var(--ciano);padding:1.5%;min-width:0}
.yd{flex:1;display:flex;flex-direction:column;gap:2%;border:3px dashed var(--tenue);padding:1.5%;min-width:0}
.bld>b,.yd>b{font-family:var(--pix);font-weight:400;font-size:.45em;color:var(--ciano)}
.yd>b{color:var(--tenue)}
.gi{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:3%;min-height:0}
.gy{flex:1;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:4%;min-height:0}
.rm{border:2px solid var(--linea);background:rgba(20,26,68,.9);text-align:left;padding:.25em .4em;display:flex;flex-direction:column;justify-content:space-between;font-size:.68em;overflow-wrap:normal;word-break:normal;line-height:.95;min-width:0;overflow:hidden}
.rm i{font-style:normal;font-family:var(--pix);font-size:.4em;color:var(--tenue);line-height:1.4}
.rm:hover{border-color:var(--giallo)}
.rm.here{background:var(--giallo);color:#111;border-color:var(--giallo)}
.rm.here i{color:#111}
.rm.met i{color:var(--ciano)}

/* schermate */
.panel{inset:4% 5%;background:rgba(20,26,68,.94);border:4px solid var(--bianco);box-shadow:0 0 0 4px #000;padding:3% 4%;display:flex;flex-direction:column;gap:.5em;overflow:auto}
.panel h2{margin:0;font-family:var(--pix);font-weight:400;font-size:.7em;line-height:1.6;color:var(--ciano)}
.panel p{margin:0;font-size:.92em;line-height:1.05;max-width:66ch}
.panel .th{color:var(--giallo)}
.go{align-self:flex-start;background:var(--rosso);color:#fff;font-family:var(--pix);font-size:.6em;padding:.9em 1.1em;line-height:1.4}
.go:hover{background:var(--giallo);color:#111}
.title{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:9%;gap:4%;pointer-events:none}
.title h1{margin:0;font-family:var(--pix);font-weight:400;font-size:1.5em;color:var(--giallo);text-shadow:.15em .15em 0 var(--rosso);text-align:center;line-height:1.4}
.title button{pointer-events:auto;font-family:var(--pix);font-size:.85em;color:var(--bianco);padding:.6em 1em;background:rgba(0,0,0,.4)}
.title .sc{font-family:var(--pix);font-size:.42em;line-height:2;color:var(--tenue);text-align:center;background:rgba(0,0,0,.45);padding:.5em 1em}
.title .sc b{color:var(--rosso);font-weight:400}
.bottom{left:3%;right:3%;bottom:4%;background:rgba(20,26,68,.94);border:4px solid var(--bianco);box-shadow:0 0 0 3px #000;padding:.8em 1em;display:flex;flex-direction:column;gap:.5em}
.bottom p{margin:0;font-size:1.05em;line-height:1.08}
.bottom .th{color:var(--giallo)}
.stats{font-family:var(--pix);font-size:.5em;line-height:2;color:var(--bianco)}
.stats b{color:var(--giallo);font-weight:400}
@media(prefers-reduced-motion:no-preference){.blink{animation:bl 1s steps(2,start) infinite}@keyframes bl{to{opacity:.15}}}

/* gira il telefono */
.rotate{position:fixed;inset:0;z-index:100;background:var(--buio);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;text-align:center}
.rotate p{margin:0;font-family:var(--pix);font-size:13px;line-height:1.8;color:var(--giallo);max-width:22em}
.rotate span{font-family:var(--txt);font-size:22px;color:var(--tenue)}
.phone{width:56px;height:96px;border:4px solid var(--bianco);border-radius:8px;position:relative}
.phone::after{content:"";position:absolute;left:50%;bottom:6px;width:10px;height:4px;background:var(--bianco);transform:translateX(-50%)}
@media(prefers-reduced-motion:no-preference){.phone{animation:rot 2s ease-in-out infinite}@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}}
@media (orientation:portrait) and (max-width:900px){.rotate{display:flex}}
.tabs{display:flex;gap:.4em;flex-wrap:wrap}
.tab{font-family:var(--pix);font-size:.45em;padding:.5em .7em;border:2px solid var(--linea);color:var(--tenue)}
.tab.on{border-color:var(--ciano);color:var(--ciano);background:rgba(94,230,255,.08)}
.tab:hover{color:var(--bianco)}
.yd.st{border-color:var(--giallo)}
.yd.st>b{color:var(--giallo)}
.tvwrap{inset:0;background:rgba(5,6,16,.92);display:flex;align-items:center;justify-content:center;gap:4%;padding:3%}
.tv{position:relative;height:100%;aspect-ratio:478/850;border:6px solid #2a2a34;border-radius:10px;box-shadow:0 0 0 3px #000,0 0 40px rgba(255,59,92,.25);background:#000;overflow:hidden}
.tv video{width:100%;height:100%;object-fit:cover;display:block}
.rec{position:absolute;left:6%;top:3%;font-family:var(--pix);font-size:.4em;color:#fff;text-shadow:1px 1px 0 #000}
.rec span{color:var(--rosso)}
.tvside{display:flex;flex-direction:column;gap:1em;align-items:flex-start;max-width:34%}
.tvt{margin:0;font-family:var(--pix);font-size:.6em;line-height:1.7;color:var(--giallo)}
.tverr{margin:0;color:var(--tenue)}
.pres{position:absolute;top:calc(var(--cy) + var(--ch) * .12);z-index:12;transform:translateX(-50%);width:44%;max-width:44%;display:flex;gap:.6em;align-items:flex-start;background:var(--bianco);color:#111;border:3px solid #111;box-shadow:4px 4px 0 rgba(0,0,0,.5);padding:.45em .55em}
.pres img{width:3.4em;height:3.4em;image-rendering:pixelated;border:2px solid #111;flex:none;background:#141a44}
.pres div{display:flex;flex-direction:column;gap:.2em;min-width:0}
.pres b{font-family:var(--pix);font-weight:400;font-size:.45em;color:#6a3a8a;line-height:1.4}
.pres span{font-size:1.05em;line-height:1.02}
.pres .hb{align-self:flex-start;margin-top:.3em;color:var(--bianco)}
.pres.val{background:#fff6c8}
.pres.val b{color:#8a6a00}
.choices{grid-template-columns:1fr!important}
.ch small{margin-left:auto}
.tabs{align-items:center}
.tabs .tl{font-family:var(--pix);font-size:.4em;color:var(--tenue);margin-right:.3em}
.tab{padding:0;border:2px solid var(--linea);opacity:.6}
.tab img{display:block;width:2.4em;height:2.4em;image-rendering:pixelated}
.tab.on{opacity:1;border-color:var(--ciano);box-shadow:0 0 0 2px var(--ciano)}
.rm.lead{border-color:var(--rosso);box-shadow:0 0 0 2px var(--rosso)}
.rm em{font-style:normal;color:var(--rosso);font-family:var(--pix);font-size:.7em}
.goal{position:absolute;left:50%;top:13%;transform:translateX(-50%);z-index:15;max-width:62%;background:rgba(11,15,42,.9);border:2px solid var(--giallo);padding:.35em .7em;font-size:.95em;line-height:1;color:var(--bianco);text-align:center;pointer-events:none}
.goal b{font-family:var(--pix);font-weight:400;font-size:.45em;color:var(--giallo);margin-right:.4em;vertical-align:middle}
.goal i{font-style:normal;color:var(--ciano)}
.hint{display:none}
.slot.bonus{border-color:var(--giallo)}
.wa{display:block;white-space:pre-wrap;margin:.4em 0;background:#dcf8c6;color:#111;padding:.4em .6em;border-radius:6px;font-size:.95em;line-height:1.05;max-width:90%}
.wa b{display:block;font-family:var(--pix);font-weight:400;font-size:.4em;color:#1f8a4f;margin-bottom:.3em}
.tab.key{border-color:var(--giallo);opacity:1}
.revp{display:flex;gap:1em;align-items:center}
.revp img{width:4.5em;height:4.5em;image-rendering:pixelated;border:3px solid var(--rosso);flex:none}
.bottom.top{bottom:auto;top:3%;font-size:.92em}
.crawl{inset:0;background:#000;overflow:hidden;perspective:18em}
.crawl .far{position:absolute;top:6%;left:0;right:0;text-align:center;margin:0;color:var(--ciano);font-size:1.1em;animation:fade 4s ease-out forwards}
.crawl .cw{position:absolute;left:14%;right:14%;top:12%;bottom:0;transform:rotateX(16deg);transform-origin:50% 100%;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 35%);mask-image:linear-gradient(transparent,#000 35%)}
.crawl .ct{position:absolute;left:0;right:0;top:100%;color:var(--giallo);text-align:justify;font-size:1.45em;line-height:1.12;animation:crawl 62s linear 1.5s forwards}
.crawl h4,.crawl h3{margin:0 0 .3em;text-align:center;font-family:var(--pix);font-weight:400}
.crawl h4{font-size:.5em}.crawl h3{font-size:.75em;margin-bottom:1em}
.crawl .ct p{margin:0 0 .8em}
.crgo{position:absolute;right:3%;bottom:4%;z-index:2}
@keyframes crawl{to{top:-210%}}
@keyframes fade{0%,60%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.crawl .cw{transform:none;-webkit-mask-image:none;mask-image:none;overflow:auto}.crawl .ct{position:static;animation:none;font-size:1em}.crawl .far{animation:none}}
.aft{display:block;margin-top:.3em}
.th .vi,.vi{width:1.8em;height:1.8em;image-rendering:pixelated;border:2px solid var(--giallo);vertical-align:middle;margin-right:.4em}
.pres.val img{border-color:#8a6a00}
.talk2{inset:2.5% 2%;background:var(--pannello);border:4px solid var(--bianco);box-shadow:0 0 0 4px #000;display:flex;flex-direction:column;gap:.5em;padding:1.6% 2%}
.talk2 .trow{flex:1;min-height:0;display:flex;gap:1em}
.talk2 #pc,.talk2 .vp{width:5.6em;height:5.6em;flex:none;image-rendering:pixelated;border:3px solid var(--ciano);background:#141a44}
.talk2 .vp{border-color:var(--giallo);align-self:flex-end}
.talk2 .tcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:.3em;min-height:0}
.talk2 h3{margin:0;font-family:var(--pix);font-weight:400;font-size:.5em;color:var(--ciano);line-height:1.5}
.talk2 h3 span{color:var(--tenue);font-family:var(--txt);font-size:1.6em;margin-left:.4em}
.talk2 .say{flex:1;min-height:0;overflow:auto;font-size:1em;line-height:1.06}
.talk2 .brow{display:flex;gap:1em;align-items:flex-end;border-top:2px solid var(--linea);padding-top:.4em}
.talk2 .choices{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1em;border:0;padding:0}
.talk2 .vtxt{flex:1;min-width:0;text-align:right;display:flex;flex-direction:column;gap:.2em;align-self:flex-end;font-size:.95em;line-height:1.04}
.talk2 .vtxt .q{color:var(--ciano)}
.talk2 .vtxt .th{color:var(--giallo)}
.talk2 .ch{font-size:.88em}
.wa{display:block}
.cut{display:block;margin-top:.4em;font-family:var(--pix);font-size:.5em;color:var(--rosso)}
.phot{display:block;margin-top:.4em;width:15em;max-width:90%;image-rendering:pixelated;border:4px solid var(--bianco);box-shadow:3px 3px 0 #000}.say.media{display:flex;gap:.8em;align-items:flex-start}.say.media .stx{flex:1;min-width:0}.med{flex:none;display:flex;gap:.5em;align-items:center}.med .phot{margin:0;max-width:none}.phot.v{width:auto;height:9.5em}.phot.s{width:8em}.phot.k{width:16em}
.gm{pointer-events:auto;margin-left:.5em;background:var(--giallo);color:#111;font-family:var(--pix);font-size:.45em;padding:.4em .6em;vertical-align:middle}
.goal{pointer-events:auto}
.radio{inset:0;background:rgba(5,6,16,.94);display:flex;align-items:center;justify-content:center;gap:5%;padding:3%}
.wt{position:relative;width:8em;height:14em;background:#2a2a32;border:4px solid #111;border-radius:.8em;box-shadow:inset -.4em 0 0 #1a1a20}
.wt .ant{position:absolute;left:1.2em;top:-3em;width:.8em;height:3em;background:#1a1a20;border:3px solid #111;border-bottom:0}
.wt .lcd{position:absolute;left:.8em;right:.8em;top:1em;background:#9ad08a;color:#1a2a1a;font-family:var(--pix);font-size:.6em;padding:.8em .5em;text-align:center}
.wt .lcd i{font-style:normal;color:#c0283a}
.wt .spk{position:absolute;left:1em;right:1em;bottom:1em;height:6em;background:repeating-linear-gradient(#111 0 .3em,#2a2a32 .3em .6em);border-radius:.3em}
.rtx{max-width:52%;display:flex;flex-direction:column;gap:.3em}
.rtx p{margin:0;font-size:1.15em;color:var(--bianco)}
.rtx p.bonk{font-family:var(--pix);font-size:1.2em;color:var(--rosso)}
.cap{left:3%;right:3%;top:3%;background:rgba(10,10,20,.85);border:3px solid var(--bianco);padding:.6em .9em;font-size:1em;line-height:1.05}
.skip{position:absolute;right:3%;bottom:4%;z-index:21}
.rev2{right:2.5%;top:3%;bottom:3%;overflow:auto;font-size:.9em;width:52%;background:var(--pannello);border:4px solid var(--bianco);box-shadow:0 0 0 3px #000;padding:.8em;display:flex;flex-direction:column;gap:.6em}

const GREET=["Ah, Valentino. Hai visto Paolucci? Nemmeno io.","Aspetto il discorso da un'ora. Ho già imparato a memoria il buffet.","Valentino! Sei l'unico che sa dove sono le cose.","Sono qui per gli auguri. Gli auguri però non arrivano.","Ciao! Hai un minuto? No? Nemmeno io.","Io non ho visto niente. Cioè, ho visto tutto, ma non ho capito niente.","Valentino, tu che pulisci: hai trovato per caso un presidente?","Mi hanno detto di aspettare qui. Sto aspettando benissimo.","Se Paolucci non arriva, il discorso lo facciamo noi. A turno.","Sai che fine ha fatto Paolucci? Ho una teoria. Anzi, tre.","Stasera c'è un'aria strana. Sa di inglese.","Ho portato i tortellini. Sono già finiti.","Ciao Valentino! Bel carrello. Nuovo?","Io a mezzanotte brindo. Con o senza discorso.","Chi cerchi? No, aspetta, lo so: lo cercano tutti.","Mi hanno chiesto di non dirti niente. Quindi non ti dico niente.","Mi sento dentro un giallo. Io sono quella che non c'entra.","Shh, ripasso gli auguri. Nel caso tocchi a me.","Hai sentito? Una risata dal cortile. Con l'accento inglese.","Paolucci mi deve un caffè dal 2019. Se lo trovi, ricordaglielo.","Io sono qui solo per il panettone. Ma dimmi pure.","Valentino! Ti stavo per chiamare. Poi mi sono distratta."];
const FOTO=["«Sì, lo conosco. Stasera però non l'ho visto. Ho visto un cappello rosso, ma quello non è lui.»","«È passato di corsa con la cartella del discorso. Diceva “torno subito”. Lo dice sempre.»","«Bella foto. Gli manca solo di essere qui.»","«L'ho visto parlare con una signora con un accento stranissimo. Lui parlava poco. Lei tantissimo.»","«No. Però ho visto una donna con l'impermeabile rosso che lo cercava. O lo portava via. Non ho capito.»","«Mi ha chiesto dov'era il cortile. Lavora qui da anni. Strano, no?»","«Faccia nota. Il nome mi sfugge. Scherzo, Valentino.»","«Me l'hanno chiesto in cinque stasera. La risposta è sempre no.»","«L'ho visto alle otto meno un quarto. Era tranquillo. Troppo tranquillo.»","«Gli ho fatto gli auguri al telefono un'ora fa. Ha riattaccato ridendo. Ma la risata non era la sua.»","«Paolucci? Era qui. Poi non c'era più. Come i tortellini.»","«Sì, sì. Cioè, no. Cioè, chiedi a qualcun altro.»"];
const STRANO=["«Strano? Una donna col cappello mi ha rubato il posto in fila.»","«Il Teatrobus stasera ha le tendine tirate. Non le tirano mai.»","«Ho sentito una signora ridere con un accento stranissimo. Inglese, credo. O di Imola.»","«Manca un impermeabile rosso dai costumi. Lo dicono tutti, quindi sarà vero.»","«Dal cortile si vede una lucina rossa che lampeggia. Tipo una telecamera che registra.»","«Qualcuno ha cambiato la suoneria del telefono dell'ufficio con l'inno inglese.»","«Strano è che nessuno abbia ancora finito lo spumante.»","«Una signora col cappello rosso mi ha fatto l'occhiolino. Aveva una voce un po' bassa, per essere una signora.»","«Qualcuno ha lasciato un rossetto rosso sul lavandino del bagno. Non è di nessuna di noi.»","«Ho trovato per terra un biglietto del 1994. L'ho buttato. Ho fatto male?»","«Le luci del cortile si sono spente e riaccese tre volte. Come un segnale.»","«Qualcuno chiedeva in giro delle sterline. Chi ha delle sterline, a San Lazzaro?»"];

    ppl:[P("mario","Mario","amministrazione",{body:"#3a3a5a",hair:"#3a2a1a"},174,{
      greet:["Valentino, finalmente uno che lavora.","Qui aspettiamo tutti il discorso. Io intanto ascolto Marracash."],again:["Il panettone è sempre lì. Io pure."],
      foto:"«Paolucci? Mi ha detto: tieni d'occhio la porta. Poi dalla porta è uscito lui.»",

      aiuto:"«Se vuoi aiutare, guarda il tavolo del buffet. Qualcuno ci ha frugato. Non solo io.»"}),P("martina","Martina","organizzazione",{body:"#444",hair:"#222"},140,{greet:["Valentino! Il buffet quest'anno lo facciamo qui nel tendone. Sto sistemando le polpette.","Trecento polpette. Le ho contate. Due volte."],again:["Le polpette sono quasi pronte. Quasi."],wa:"«Mezzano? Io leggo “mezzo chilo”. Di polpette.»",strano:"«Strano? Qualcuno ha già mangiato sei polpette. Sei! E il buffet non è ancora aperto.»",brin:"«Cin cin! Con una polpetta, però.»"}),P("giuliappi","Giuliappi","promozione",{body:"#7a5a3a",hair:"#1a1a20"},228,{greet:["Valentino! Sorridi, sto facendo una storia per i social.", "Stasera ho fatto trecento foto. Duecentonovanta sono mosse. Ma dieci sono capolavori."],again:["Ancora una storia. Sorridi."],foto:"«Paolucci? Ho tre storie pronte con lui che fa il discorso. Se non arriva le pubblico lo stesso.»",strano:"«Ho fatto una foto al foyer alle nove. Sullo sfondo c'è un cappello rosso. Ingrandisco... sfocato. Come sempre i cattivi.»"})],
    objs:[{n:"il tavolino",b:[224,128,36,22],txt:"Il buffet quest'anno è nel tendone. Sul tavolino nero del foyer è rimasto solo un panettone, da solo, aperto.",th:"Povero panettone."},{n:"la bacheca",b:[28,92,78,30],txt:"La bacheca della stagione. Tre locandine. Su una, qualcuno ha disegnato a penna un cappello rosso.",th:"Otra volta el cappello."},{n:"il distributore",b:[214,96,35,50],txt:"Il distributore automatico. Valentino ci mette una moneta. Il distributore se la tiene.",th:"Ladrón."},{n:"i due gatti",b:[2,166,40,26],txt:()=>S.catOk?"Marra e Cash, i gatti di Mario, dormono vicini come se niente fosse.":"Due gatti neri si azzuffano in un angolo. Da un bel po'.",th:"Gattos. Miau."},{n:"l'orologio",b:[58,58,20,20],txt:()=>`Sono le ${hhmm(S.t)}. L'orologio del foyer va avanti di due minuti, come sempre.`,th:"Tic, tac."},{n:"la porta a vetri",b:[343,40,41,160],txt:"Fuori, la nebbia. In fondo al cortile, il Teatrobus ha una luce accesa.",th:"¿Una luce en el autobús?"}]},

      greet:["Valentino! Stasera la biglietteria è più trafficata di un aeroporto.", "Ho le chiavi di tutto. Di tutto tranne che della mia pazienza: quella l'ho persa alle sei."],again:["Gli omaggi sono ancora lì. Tre."],
      divaga:"«Paolucci? Io so solo che ho tre omaggi non ritirati. Tre! Intestati a chi, poi? Aspetta che controllo...»",

      strano:"«Una donna con l'impermeabile mi ha chiesto il resto in sterline.»",
      aiuto:"«Che gentile. Controlla il cassetto degli omaggi, che non si chiude più.»"})],
    objs:[{n:"il bancone",b:[40,128,300,12],txt:"Il bancone nero della biglietteria. Accanto al monitor, una pila di libretti della stagione. Su uno, qualcuno ha disegnato a penna un cappello rosso.",th:"Que estrano."},{n:"il cartello degli accrediti",b:[278,70,46,20],txt:"ACCREDITI STAMPA · VOUCHER. Stasera nessun giornalista. Solo un voucher a nome “The President”, mai ritirato.",th:"¿The President?"},{n:"l'estintore",b:[82,94,12,32],txt:"L'estintore è al suo posto, controllato, a norma. William sarebbe fiero.",th:"A norma."},{n:"il listino prezzi",b:[2,76,26,44],txt:"I prezzi della stagione. In fondo, a penna: “Ridotto presidenti: gratis”.",th:"Ja."}]},
  organizzatrici:{n:"Ufficio organizzatrici",m:"Organizz.",z:"itc",wall:"#3a4a2a",
    ppl:[P("jessica","Jessica Bruni","direttrice generale, capa dei capi",{body:"#1f8a4f",hair:"#e3b866",long:1,gl:1,collar:1},186,{
      greet:[{t:"Valentino, abbiamo un problema.",now:1},"E ho bisogno di te."],again:["Ancora qui? Sorrido, ma il tempo corre."],
      foto:"«Sì, è lui. Alle 19:40 era qui, ha preso un caffè e ha detto: torno subito. Ho segnato l'ora. Io segno sempre l'ora.»",
      strano:"«Qualcuno ha spostato una freccia sul mio calendario. Nessuno tocca il mio calendario.»",
      aiuto:"«Gentile, ma qui è tutto in ordine. Al massimo svuota il cestino: c'è dentro una cosa che non ho buttato io.»",
      clue:{cappello:"«Questo non è in nessun inventario. E gli inventari io li so a memoria.»",biglietto:"«“Happy new ear”. Conosco una sola persona che scrive così. E non è Paolucci.»",timbro:"«Un biglietto del bus obliterato oggi? L'unico bus qui è nel cortile. E non parte da anni.»"}},{img:IMGD.jessica_32})],
    objs:[{n:"il cestino della carta",b:[4,154,28,34],main:1},{n:"il calendario",b:[96,114,18,15],txt:"Tutte le frecce puntano al 31. Una, a matita, esce dal foglio e punta verso il cortile.",th:"¿Verso el cortile?"},{n:"la fotocopiatrice",b:[186.4,100,55.2,46],txt:"La fotocopiatrice. È ancora calda: qualcuno ha fotocopiato qualcosa da poco.",th:"Qualchedunos ha fotocopiado da poco."}]},
  amministrazione:{n:"Amministrazione",m:"Amministr.",z:"itc",wall:"#4a4a5a",
    ppl:[P("vittoriaA","Vittoria A.","capa dei soldi",{body:"#7a2a4a",hair:"#4a2a1a",long:1},148,{
      greet:["Valentino. Se sei qui per un rimborso, il modulo è quello giallo."],again:["Il modulo giallo, Valentino. Sempre quello."],
      divaga:"«Sparito? Il 31? Con la rendicontazione aperta? Non può sparire, deve firmare. Ti faccio vedere quante firme mancano...»",
      foto:"«Paolucci mi deve tre mandati di pagamento entro stasera. Se è sparito per non firmare, lo trovo io.»",
      strano:"«Una ricevuta per il noleggio di un impermeabile rosso. Nessun capitolo di spesa, nessuna firma. Queste cose io le vedo.»",
      aiuto:"«Se vuoi aiutare, guarda nei raccoglitori. C'è una cosa che non è una fattura, e io non l'ho registrata.»",
      clue:{cappello:"«Quanto costa un cappello così? No, non dirmelo. Lo scopro da sola.»"}}),P("sonia","Sonia","amministrazione",{body:"#5a6a9a",hair:"#2a1a14",long:1},232,{
      greet:["Ciao Valentino. Qui si chiude l'anno, in tutti i sensi."],again:["Siamo ancora qui. I conti non si chiudono da soli."],
      foto:"«L'ho visto verso le otto con la cartella del discorso sotto il braccio. Andava di fretta, verso il cortile.»",
      strano:"«Il telefono dell'ufficio ha squillato tre volte. Dall'altra parte solo una risata.»",
      aiuto:"«Gentile. Prova a guardare nei raccoglitori: Vittoria dice che qualcosa non torna.»"}),P("tacconi","La Tacconi","in telelavoro da Siena",{body:"#4a8a7a",hair:"#8a5a2a",long:1},0,{
      greet:["Mi sentite? Mi vedete? Sono la Tacconi! Si è bloc... ah no, eccomi.", "Da qui vedo tutto: le telecamere, le mail, il cortile. Tutto a scatti, ma tutto."],again:["Ci sono! Cioè, ci sono a tratti."],
      foto:"«Paolucci? Era in call con me alle sette e mezza. A un certo punto dietro di lui è passato un cappello rosso enorme. Ho pensato: sarà la connes... sione.»",
      strano:"«Da qui vedo la telecamera del cortile. Il Teatrobus ha le luci accese. Da qui si vede meglio che da lì, eh.»",
      aiuto:"«Aiutarmi? Riavvia il router. No, scherzo. Dite a Vittoria che le ho mandato la mail. Due volte.»"},{screen:1})],
    objs:[{n:"i raccoglitori",b:[167,118,44,48],main:1},{n:"il quadro delle chiavi",b:[4,99,30,40],txt:"Il quadro delle chiavi: qui finiscono tutte le chiavi perse del teatro. Nessuno sa più cosa aprono.",th:"Quante chiaves..."},{n:"la pila di fogli",b:[212,118,22,20],txt:"Fatture, preventivi e un modulo per il noleggio di un impermeabile rosso. Firma illeggibile.",th:"Un impermeabile rojo."},{n:"la luna",b:[326,47,17,17],txt:"«Che fai tu, luna, in ciel? dimmi, che fai, silenziosa luna?»",th:"¡Ah, Joaquín Leopardos! ¡Yo amo la poesía!"}]},
  direzione:{n:"Ufficio direzione",m:"Direzione",z:"itc",wall:"#5a3a2a",
    ppl:[P("deca","La Deca","direttrice artistica",{body:"#c06a2a",hair:"#3a2010",long:1},124,{
      greet:["Uno, due, tre... Paolucci, vieni fuori, non ci arrabbiamo! Con i bambini funziona sempre.", "Valentino, tu che pulisci sotto i banchi: i nascondigli li conosci tutti, no?"],again:["Ancora niente? Con i bambini funziona sempre."],
      foto:"«Con i bambini funziona così: chi si nasconde vuole essere trovato. Paolucci ha lasciato il discorso a metà e ha detto “torno subito”. Lo dicono anche loro.»",
      strano:"«Di strano, a parte noi? Niente, Valentino. Stasera qui è tutto tranquillo.»",
      aiuto:"«Che caro. Allora guarda la scrivania di Paolucci: lì sotto c'è sempre qualcosa che non dovrebbe esserci.»",
      clue:{cappello:"«Un cappello rosso a tesa larga. I bambini disegnano così i cattivi. Anche quelli simpatici.»"}}),P("micaela","Micaela","direttrice artistica, bandi europei",{body:"#2a3a6a",hair:"#1a1a20",long:1},206,{
      greet:["Sorry, sono in call. Oui, oui, j'arrive! Un momento, Lisbona... Valentino, che succede?", "Ho Bruxelles in una cuffia e Lisbona nell'altra. Se mi parli, parlami a gesti, va benissimo."],again:["Ancora in call. Three, quattro lingue, zero pause."],
      foto:"«Paolucci è il legale rappresentante sul bando che scade alle 23:59. Se sparisce lui, chi firma? Wer unterschreibt? Who signs? Qui signe? Nessuno.»",
      strano:"«In call con Bruxelles, alle mie spalle, qualcuno rideva con un accento terribile. Mi sono girata: nessuno.»",
      aiuto:"«Grazie, Valentino. Al massimo tienimi il telefono mentre parlo con Lisbona.»",
      clue:{biglietto:"«Dammi qua, lo traduco io. “Very sicure place”: un posto sicurissimo. “Happy new ear”: felice orecchio nuovo. “Signed: The President”: firmato, il Presidente. In nessuna lingua del mondo questo è Paolucci.»"},
      clueTh:{biglietto:"¡Finalmente qualcuno que mi capisce!"}}),P("cristina","Cristina","vicepresidente",{body:"#2f6fd0",hair:"#34200f"},330,{greet:["Oddiodio... tocca a me.",{t:"Haaaah...",turn:1},"Valentino. Se Paolucci non si trova entro mezzanotte, il discorso tocca a me. A me! Davanti a tutti!",{who:"val",t:"Tranquila, señorita Cristina... (¡Oh mamma! ¡La señora Cristina!)"},"Io non ho niente di pronto. Ho solo l'ansia. Quella sì, prontissima, con le slide."],again:["Ho scritto tre righe di discorso. Le ho cancellate. Ne ho scritte due. Cancellate anche quelle."],wa:"«“Mezzano...”. Mezzanotte. Mancano poche ore. E se non torna... no, non ci voglio pensare.»",foto:"«Paolucci mi ha sempre detto: “se non ci sono io, tocca a te”. Pensavo fosse un modo di dire. Non lo era!»",strano:"«Strano? Strano è che tutti mi guardino come se il discorso toccasse già a me. Smettetela. Vi prego.»",aiuto:"«Aiutami tu! Trovalo, così il discorso non lo faccio io. Ti prego.»"})],
    objs:[{n:"la scrivania di Paolucci",b:[168,126,98,46],main:1},{n:"il discorso",b:[196,120,26,8],txt:"Il discorso di fine anno. Si interrompe a metà frase: “E quest'anno, care colleghe e cari colleghi, vorrei”",th:"¿Vorrei qué cosa?"},{n:"la finestra",b:[214,56,112,36],txt:"Fuori è buio. I fuochi d'artificio non sono ancora cominciati. Riflesso nel vetro, per un attimo, un cappello a tesa larga.",th:"¿L'ho vistado de verdad?"},{n:"il quadro",b:[182,66,26,22],txt:"Il manifesto di Habil delle città, incorniciato. Il vetro brilla: l'ha pulito Valentino.",th:"Perfecto."},{n:"il divano",b:[82,118,84,36],txt:"Il divano grigio della direzione. Sotto i cuscini: due penne, una caramella e nessun Paolucci.",th:"Aquí no está."},{n:"l'Apeatro",b:[283,89,17,13]},{n:"la luna",b:[298,62,16,16],txt:"«Dov’era la luna? chè il cielo notava in un’alba di perla» (Giovanni Pascoli, L’assiuolo)",th:"¡Mica pippas!"}]},
  sala:{n:"Sala grande",z:"itc",wall:"#1a1a2a",
    ppl:[P("william","William Sheldon","capo dei tecnici",{body:"#1c1c22",hair:"#2a1a10",beard:"#2a1a10",gl:1},98,{
      greet:["Ehi Valentino. Audio, luci, camera: tutto pronto, tutto testato, tutto a norma.", "Manca solo Paolucci. E quello non lo posso cablare io."],again:["Ancora tutto pronto. Tocca a te."],
      foto:"«Paolucci? Mi ha chiesto di provare il microfono. Ha detto “prova, prova”, poi è uscito dalla porta del cortile.»",
      strano:"«Qualcuno ha tirato una prolunga dal palco fino al cortile. Non sono stato io, e io so dove va ogni cavo.»",
      aiuto:"«Grazie, qui ci penso io. Però sotto le poltrone della prima fila ho visto qualcosa luccicare.»",
      clue:{cappello:"«Bella falda. In scena ci vorrebbe un controluce.»",timbro:"«Il Teatrobus? La batteria l'ho ricaricata io la settimana scorsa. Mi avevano detto “per sicurezza”. Chi me l'aveva chiesto?»"}},{img:IMGD.william_32}),P("izzo","Izzo","attore",{body:"#1a1a20",hair:"#3a2a1a"},120,{greet:["Ciao Valentino! Stiamo provando.", "Ho preso tre papere. Tre! Nella stessa battuta."],again:["Auguri, auguri, auguri. Ci sto lavorando."],foto:"«Paolucci mi ha detto: “tienimi il posto in prima fila”. Io gliel'ho tenuto. Lui non è tornato.»",strano:"«Strano? Stasera ho preso tre papere. Io non prendo mai papere.»"})],
    objs:[{n:"le poltrone della prima fila",b:[0,184,384,32],txt:"Le poltrone della prima fila. Sono tutte rotte. Da anni.",th:"Pobrecitas poltronchinas."},{n:"la scala",b:[54,58,30,76],txt:"La scala. Controllata, collaudata, a norma.",th:"¡Aquí está el mejor preposto du mundo!"},{n:"il leggio",b:[176,74,32,58],txt:"Il leggio è vuoto. Il microfono è acceso. Manca solo chi parla.",th:"Silencio."},{n:"la telecamera",b:[172,162,40,48],txt:"La telecamera inquadra il leggio vuoto da un'ora. Nessuno ha il coraggio di spegnerla.",th:"Muy profesionale."}]},
  camerini:{n:"I tre camerini",m:"Camerini",z:"itc",wall:"#5a2a2a",
    ppl:[P("lea","Lea C.","attrice",{body:"#c0283a",hair:"#16161d",long:1},176,{
      greet:["Valentino! Che luce terribile stasera."],again:["Sono ancora al trucco, Valentino."],
      divaga:"«Sono qui dalle sei. Secondo te questo rossetto regge in video? No, aspetta, guarda con questa luce...»",
      foto:"«Paolucci è passato a provare il discorso davanti allo specchio. Ha detto “Care colleghe” e qualcuno l'ha chiamato da fuori.»",
      strano:"«Dalla rastrelliera manca un impermeabile rosso. Era il mio preferito per gli inchini.»",
      aiuto:"«Grazie, Valentino. Allora guarda dietro gli specchi: qualcuno ci ha infilato qualcosa.»"}),P("ida","Ida","attrice",{body:"#444",hair:"#222"},206,{greet:["Valentino! Annyeong! Ho appena finito una coreografia K-pop in camerino."],again:["Ancora qui? Ti insegno il ritornello."],foto:"«Paolucci? In un manga sarebbe il protagonista che sparisce al capitolo uno. Al capitolo tre torna con i poteri. Al cinque si scopre il cattivo: quella col cappello.»",strano:"«Una donna con l'impermeabile rosso mi ha chiesto gli arrosticini, con un accento stranissimo. Gli ho detto che quelli veri li fa solo mia nonna, in Abruzzo.»",aiuto:"«Ti aiuto io! Dammi il mocio, faccio io. Tu guarda dietro gli specchi.»"}),P("giulia","Giulia","attrice e regista",{body:"#444",hair:"#222"},232,{greet:["Valentino! Serve qualcosa? Aggiusto, monto, smonto, recito."],again:["Dimmi cosa serve, ci penso io."],foto:"«Da scout te lo dico: tracce fresche verso il cortile. Due persone. Una con un impermeabile molto lungo.»",strano:"«Qualcuno ha fatto un nodo da scout alla maniglia del Teatrobus. Fatto male. Non è dei nostri.»",aiuto:"«Lascia, faccio io. Tu guarda dietro gli specchi, io controllo il resto.»"})],
    objs:[{n:"gli specchi",b:[40,46,276,70],main:1},{n:"la rastrelliera dei costumi",b:[2,56,38,56],txt:"Manca una gruccia. Sull'etichetta: IMPERMEABILE ROSSO, TAGLIA PRESIDENTE.",th:"¿Taglia presidente?"},{n:"le lampadine",b:[40,44,278,10]},{n:"la lampadina che lampeggia",b:[245,43,13,12]},{n:"la parrucca",b:[282,92,18,24],txt:"Una parrucca su una testa di polistirolo. Ha l'aria di aver visto tutto.",th:"Si potesse parlare..."}]},
  magazzino:{n:"Magazzino",z:"itc",th:"El magazzino. Puzza de vernisa.",ppl:[P("jack","Jack","attore",{body:"#2a2a2a",hair:"#1a1a20",beard:"#1a1a20"},186,{greet:["Cerco un costume. Mi manca l'impermeabile rosso per la scena."],again:["Ancora niente impermeabile."],foto:"«Paolucci? No. Però chi ha preso l'impermeabile rosso aveva la sua taglia. Anzi, una taglia più grande. Taglia presidente.»",strano:"«Il baule dei costumi è stato richiuso al contrario. Così lo chiude solo chi non lavora qui. O chi ci lavorava una volta.»",aiuto:"«Aiutami a cercare nel baule, va'.»"})],
    objs:[{n:"il baule dei costumi",b:[150,164,40,24],main:1},{n:"gli scaffali",b:[66,64,134,72],txt:"Fari, cavi, prolunghe, scatoloni. Un cartello dice: PORTATA MASSIMA PER RIPIANO 20 KG. Nessuno l'ha mai pesato.",th:"Veinte chili. Más o meno."},{n:"il banco da lavoro",b:[200,130,134,40],txt:"Il banco da lavoro. Morsa, nastro, viti contate una per una. Sotto, una cassetta con scritto: NON TOCCARE.",th:"No toco nada."},{n:"il frigo",b:[296,100,32,72],txt:"Il frigo del magazzino. Dentro, una sola lattina con scritto a pennarello: «NON È TUA».",th:"No es mía."},{n:"le sedie appese",b:[346,34,38,44],txt:"Sedie appese al muro, a testa in giù. Pronte per una scenografia che nessuno ricorda più.",th:"Sillas volantes."},{n:"il cono",b:[14,148,34,30],txt:"Un cono stradale. Nessuno sa da quale strada venga.",th:"Misterio."},{n:"la cassetta del pronto soccorso",b:[362,94,22,18]}]},
  corridoi:{n:"Corridoi e bagni",z:"itc",wall:"#1c1c22",
    ppl:[P("paolo","Paolo F.","attore",{body:"#c08a2a",hair:"#6a4a2a"},176,{
      greet:["Scusa, c'è fila. Anche per te?","Ah no, tu lavori. Beato te."],again:["Sempre in fila. È una tradizione."],
      foto:"«È passato di qui con la cartella del discorso. Bianco come un lenzuolo. Dietro di lui, una donna col cappello rosso.»",
      strano:"«Qualcuno ha lasciato un secchio in mezzo al corridoio. E non sei stato tu, si vede.»",
      aiuto:"«Il mocio no, grazie. Se hai perso qualcosa, guarda nel quadro delle chiavi in amministrazione: le cose perse finiscono lì.»"})],
    objs:[{n:"il secchio",b:[100,162,30,26],txt:"Il secchio di Valentino. Acqua, detersivo e basta.",th:"Mi cubo."},{n:"il cartello delle toilette",b:[16,64,112,36],txt:"TOILETTE, per tutte e per tutti: uomini, donne, robot, alieni, sirene, chi va in carrozzina e chi cambia il pannolino. Valentino approva: si pulisce uguale.",th:"Tutti benvenutos."},{n:"il bagno",b:[247,37,70,113],txt:"La porta del bagno è aperta. Dentro, l'antibagno con il lavandino e in fondo la porta del WC: occupato da quaranta minuti. Da dentro, qualcuno ripete: “ancora cinque minuti”.",th:"Siempre uguale."}]},
  cortile:{n:"Cortile",z:"fuori",
    ppl:[P("igor","Igor","tecnico, fuma",{body:"#3a4a3a",hair:"#2a1a10",hat:"#2a2a3a"},160,{
      greet:["Brrr. Valentino, fumi anche tu? No? Bravo, fai bene.", "Siamo qui fuori da un'ora. Ultima sigaretta, giuro."],again:["Ultima sigaretta. Giuro."],
      foto:"«Paolucci? Era qui fuori verso le otto con una donna col cappello a tesa larga. Sono andati verso il fondo del cortile.»",
      strano:"«Il Teatrobus ha le tendine tirate. Non le tirano mai.»",
      aiuto:"«Gentile. Ma qui fuori non c'è niente da fare: solo freddo e mozziconi.»"}),P("cavrini","Cavrini","tecnico, fuma",{body:"#4a6a8a",hair:"#999999",hat:"#7a2a2a"},186,{

const QX={"mario": [{"l": "Che musica ascolti stasera?", "a": "«Stasera? Marracash in cuffia, poi Rossini per il brindisi. Il Barbiere di Siviglia a mezzanotte è perfetto.»", "th": "De Marracash a Rossini. ¡Qué hombre completo!"}, {"l": "Come stanno i tuoi gatti?", "a": "«Tutti e due a casa, sul divano, al caldo. Loro sì che hanno capito come si passa l'ultimo dell'anno.»", "th": "Los gatos, siempre más listos de nosotros."}], "giuliappi": [{"l": "Mi insegni un passo di danza tribale?", "a": "«Volentieri! Piedi ben piantati, bacino che ondeggia, braccia come serpenti. No, Valentino, quella è la macarena.»", "th": "En Perù la macarena es danza tribal, ¡te lo juro!"}, {"l": "Quanti like fa la tua storia?", "a": "«Per ora tre. Uno è mio, uno di mia mamma e uno di Jessica, per dovere.»", "th": "Tres likes. Ahora cuatro: el mio."}], "gloria": [{"l": "Come sta la creatura?", "a": "«Benissimo! Dorme poco, e quindi dormo poco anch'io. Ma guarda che foto: non è la cosa più bella che hai mai visto?»", "th": "¡Qué maravilla! ¡Tutto la mamma!"}, {"l": "Torni presto a casa stanotte?", "a": "«Il prima possibile. Brindisi, abbraccio a tutti e via: a mezzanotte e un quarto sono in pigiama.»", "th": "Pigiama a mezzanotte. Sabiduría."}], "jessica": [{"l": "Come sta Aurorita?", "a": "«Aurorita sta benissimo. Ha già imparato a dire «no»: le ho fatto vedere come faccio io in riunione.»", "th": "¡Aurorita! ♥"}, {"l": "Come fai a sorridere sempre?", "a": "«Esercizio. E una lista. Prima la lista, poi il sorriso.»", "th": "Primero la lista. Apuntado."}], "vittoriaA": [{"l": "Come vanno i conti?", "a": "«I conti? Diciamo che anche quest'anno abbiamo evitato la bancarotta. Per l'ennesima volta. E sono qui solo da un anno.»", "th": "La señora de los dineros. ¡Una santa!"}, {"l": "Ti trovi bene con noi?", "a": "«Sono arrivata un anno fa e mi sembra di essere qui da sempre. Sarà che ogni settimana c'è un'emergenza.»", "th": "Ya es una de nosotros."}], "sonia": [{"l": "È vero che vai sott'acqua?", "a": "«Sì, faccio immersioni. Sott'acqua c'è un silenzio... L'esatto contrario di un'amministrazione il 31 dicembre.»", "th": "Yo bajo el agua solo en la doccia."}, {"l": "Posso chiederti della mia busta paga?", "a": "«Certo, Valentino. Ma il 2 gennaio, con calma e con un caffè. Stasera è festa anche per le buste paga.»", "th": "El 2 de enero. Con cafesito."}], "tacconi": [{"l": "Come va a Siena?", "a": "«Benissimo! Qui si parla già del Palio. Io la mia contrada la tifo anche dalla webcam.»", "th": "El Palio. Cavallos en la piazza. ¡Qué locura!"}, {"l": "Ma tu mi vedi bene?", "a": "«Ti vedo a quadrettini, Valentino. Sembri il personaggio di un videogioco.»", "th": "¿Un videogioco? ¡Qué idea rara!"}], "deca": [{"l": "Come stanno i bambini dei corsi?", "a": "«Benissimo! Alla festa prima delle vacanze mi hanno regalato un disegno: io con dieci braccia. Dicono che è perché aiuto tutti.»", "th": "Diez brazos. ¡Como la señora Deca!"}, {"l": "Mi dai un consiglio?", "a": "«Sempre. Respira, bevi un bicchiere d'acqua e fai una cosa per volta. Funziona coi bambini e funziona coi grandi.»", "th": "Una cosa a la vez. ¡Gracias, mamma Deca!"}, {"l": "Hai fame?", "a": "«Ho sempre dei biscotti in borsa. Tieni, prendine uno. Anzi due, che sei magro.»", "th": "¡Biscottos! Me quiere bien, la señora Deca."}], "micaela": [{"l": "Paolucci fa sempre così?", "a": "«Valentino, lo conosco da tanti anni. L'ho pure sposato. Sì: fa sempre così.»", "th": "¡Pobre señora Micaela!"}, {"l": "Con quale telefono parli adesso?", "a": "«Con quello di destra parlo con Bruxelles, con quello di sinistra con Lisbona. Se li scambio, ci scappa un progetto europeo.»", "th": "Dos telefonos, cuatro linguas, cero vacaciones."}], "cristina": [{"l": "Ti piace come ho pulito l'ufficio?", "a": "«Pulito benissimo, Valentino. Ma quella pianta davanti alla finestra... la sposterei di mezzo metro. La luce, capisci? La luce.»", "th": "Medio metro. Sì, señorita Cristina."}, {"l": "Come sarebbe il foyer dei tuoi sogni?", "a": "«Legno chiaro, luci calde, poltroncine di velluto verde. E nessun manifesto attaccato con lo scotch. Mai più.»", "th": "¡Ay! Lo scotch lo ho messo yo..."}, {"l": "Posso aiutarti in qualcosa?", "a": "«Che gentile. Sì: domattina bagna le piante della direzione. Sono l'unica cosa qui dentro che non si lamenta.»", "th": "Sì, señorita Cristina. Subito, señorita."}], "william": [{"l": "Come fai a essere così preciso?", "a": "«Ogni cavo ha il suo posto, ogni faro il suo numero. Se un faro è storto di due gradi, la notte non dormo.»", "th": "Dos grados. ¡Qué artista!"}, {"l": "Che luce faresti per il discorso?", "a": "«Un taglio caldo da sinistra, un controluce blu e un occhio di bue piccolo piccolo. Il presidente deve sembrare umano, non un santo.»", "th": "Humano, no santo. Bien dicho."}], "lea": [{"l": "Come sta tuo figlio?", "a": "«Ha dieci anni e mi corregge la dizione. Dice che a casa parlo come una persona normale. Che offesa.»", "th": "¡Qué niño listo!"}, {"l": "Mi insegni uno scioglilingua?", "a": "«Facile: «Sopra la panca la capra campa, sotto la panca la capra crepa». Ora tu.»", "th": "Sopra la panca la crapa... la capra... ¡ay, caramba!"}], "ida": [{"l": "Mi canti un pezzo di un musical?", "a": "«Solo il ritornello, poi parte la coreografia! Ai miei allievi lo dico sempre: nel musical si canta, si balla e si sorride. Tutto insieme.»", "th": "Canta, baila y sonríe. Yo solo barro."}, {"l": "Che cosa leggi?", "a": "«Un manga, ovviamente: volume 34. E in cuffia il K-pop. In Abruzzo mia nonna ancora non ci crede.»", "th": "La abuela tiene razón."}], "giulia": [{"l": "Com'è fare teatro in carcere?", "a": "«È una delle cose più belle che faccio. Lì dentro il teatro è un'ora d'aria vera. E gli attori sono puntualissimi.»", "th": "Puntualissimos. ¡No como aquí!"}, {"l": "È vero che sei scout?", "a": "«Certo! Nello zaino ho corda, coltellino e cerotti. Se crolla il teatro, sopravviviamo.»", "th": "La señorita Giulia, siempre preparada."}], "jack": [{"l": "Qual è il tuo film preferito?", "a": "«Uno solo? Impossibile. Stasera dico Nuovo Cinema Paradiso. Domani te ne dico un altro.»", "th": "Cinema Paradiso. Yo lloro siempre."}, {"l": "Che film guardi a Capodanno?", "a": "«Una maratona: tre film di fila, popcorn e coperta. Il primo dell'anno lo passo sul divano.»", "th": "Tres películas. ¡Qué programa!"}], "paolo": [{"l": "Mi insegni a combattere per finta?", "a": "«Certo. Regola numero uno: lo schiaffo lo fa chi lo riceve. Batti le mani così e giri la testa. Visto? Nessun dolore.»", "th": "¡Pam! ¡Qué miedo! Y no me duele nada."}, {"l": "Ti sei mai fatto male in scena?", "a": "«Mai. Il combattimento scenico è una danza: se tutti sanno i passi, nessuno si fa male.»", "th": "Una danza con puños."}], "igor": [{"l": "Che concerto hai fatto ultimamente?", "a": "«Un concerto rock la settimana scorsa: tre ore, ottanta cavi e un chitarrista che voleva tutto più forte.»", "th": "Más fuerte, siempre más fuerte."}, {"l": "Mi fai una prova microfono?", "a": "«Uno, due, prova. Sa, sa. Perfetto, Valentino: hai una bella voce. Bassa, calda, un po' spagnola.»", "th": "¡Un poco española! ¿Solo un poco?"}], "cavrini": [{"l": "Mi offri una sigaretta?", "a": "«No, Valentino: tu non fumi e fai bene. Io smetto a gennaio. Come ogni gennaio.»", "th": "Como cada enero. Claro."}, {"l": "Che lavoro stai facendo?", "a": "«Aspetto che finisca la serata per smontare tutto. È il mio momento preferito: quando gli altri vanno a casa.»", "th": "Yo también. Mismo trabajo."}], "carlo": [{"l": "Quanti soldatini hai?", "a": "«Milletrecento, tutti dipinti a mano. Quando vado in pensione, rifaccio Waterloo sul tavolo della cucina.»", "th": "¡Waterloo en la cocina! ¡Qué hombre!"}, {"l": "Quanti giorni ti mancano alla pensione?", "a": "«Centottantuno. Contando anche oggi, centottantadue. Ma chi conta?»", "th": "Él cuenta. Él cuenta todo."}], "irene": [{"l": "Come va il Bologna?", "a": "«Il Bologna è una fede, Valentino. Si soffre, si spera, si canta. Come a teatro, ma con la sciarpa.»", "th": "¡Forza Bologna! ...¿Se dice así?"}, {"l": "Che spettacolo stai preparando?", "a": "«Un testo nuovo, ancora segreto. Ti dico solo che in scena ci sarà una scopa. Potresti farmi da consulente.»", "th": "¿Consulente de escoba? ¡Por fin!"}], "bagnara": [{"l": "Com'è andata la giornata?", "a": "«Lunga! Iscrizioni, telefonate e un bambino che aveva perso una scarpa. La scarpa l'abbiamo trovata, il bambino pure.»", "th": "Todo encontrado. ¡Qué eficiencia!"}, {"l": "Tu e la Jessichina siete sempre insieme?", "a": "«Sempre! Lei risponde al telefono, io alle mail. Se una delle due manca, l'altra fa tutte e due le cose. Male.»", "th": "Dos amigas, un front office."}], "jessichina": [{"l": "Com'è andata la giornata?", "a": "«Da front office: cento domande, novantanove risposte. Quella che manca la troviamo a gennaio.»", "th": "Enero. Siempre enero."}, {"l": "Tu e la Bagnara siete sempre insieme?", "a": "«Siamo una squadra. Lei si ricorda le facce, io i nomi. Insieme facciamo una persona completa.»", "th": "Una persona completa. ¡Qué bonito!"}], "laura": [{"l": "Com'è essere l'ultima arrivata?", "a": "«Bellissimo! Tutti mi trattano come la mascotte. Mi regalano le caramelle e mi chiedono di prendere le cose dagli scaffali bassi.»", "th": "La mascota del teatro."}, {"l": "Perché proprio gli asparagi?", "a": "«Perché un mazzetto d'asparagi sta stretto, dritto e unito. Come deve stare un gruppo in scena. E poi mi fa ridere.»", "th": "Espárragos. Esto lo uso yo también."}], "monia": [{"l": "Da dove arrivi stasera?", "a": "«Da Casola Valsenio! Un'ora di curve per venire e una per tornare. In macchina canto Romagna mia, così passa prima.»", "th": "Romagna mia... ¡Qué bonita canción!"}, {"l": "Mi insegni a respirare col diaframma?", "a": "«Mano sulla pancia. Inspira: la pancia si gonfia. Espira: si sgonfia. Valentino, quello è trattenere il respiro.»", "th": "No respiro más. ¡Ay!"}], "patty": [{"l": "È vero che vai spesso a New York?", "a": "«Appena posso! Vado a studiare danza: tre lezioni al giorno, e torno con i piedi distrutti e il cuore pieno.»", "th": "Nueva York. ¡Qué lujo!"}, {"l": "Mi insegni un passo?", "a": "«Plié! Ginocchia in fuori, schiena dritta... e adesso su, relevé. Bravissimo, Valentino. Quasi.»", "th": "Casi. Siempre casi."}], "mattia": [{"l": "Che libro stai leggendo?", "a": "«Tre, contemporaneamente. Uno sul comodino, uno in borsa e uno in bagno. Quello in bagno è il migliore.»", "th": "En el baño, claro. ¡Lo pulisco yo!"}, {"l": "Scriveresti una parte per me?", "a": "«Ci penso. Ti vedo bene in un monologo senza parole: tu, una scopa e un palco vuoto. Il pubblico piange.»", "th": "Llora el público. Yo también."}], "gio": [{"l": "Com'è andata la regia d'opera al Duse?", "a": "«Un'emozione enorme: orchestra, coro, cantanti. Qui a teatro bisticciamo in cinque, lì eravamo in cento.»", "th": "¡Ciento! ¡Qué casino bonito!"}, {"l": "È vero che fai anche il falegname?", "a": "«Sì, per amore: ho cominciato per fare un regalo e non ho più smesso. Se ti serve una mensola, chiedi.»", "th": "Una mensola para mis escobas. ¡Sì!"}], "biljana": [{"l": "Come si dice «buon anno» in macedone?", "a": "«Srekjna Nova Godina! Prova tu, Valentino. ...Quasi. Ti do sette.»", "th": "Srek... srekna... ¡Feliz año, y basta!"}, {"l": "Che ruolo fai nella prova?", "a": "«La sorella cattiva. Io, che sono la persona più dolce del mondo! Ma il bello del teatro è proprio essere qualcun altro.»", "th": "Dulce en la vida, mala en el escenario."}], "caterina": [{"l": "Cosa stai scrivendo?", "a": "«Uno spettacolo per ragazzi. C'è un drago che ha paura del buio. I ragazzi capiscono subito tutto, i grandi no.»", "th": "Un dragón con miedo. Como yo con la señorita Cristina."}, {"l": "Tuo papà racconta ancora lo sport?", "a": "«Papà racconta lo sport da una vita. Da lui ho imparato una cosa: ogni storia ha bisogno di un buon finale.»", "th": "Un buen final. Ahora lo busco."}], "izzo": [{"l": "Che fai stasera?", "a": "«Ripasso la parte. Ho tre battute e le provo in tutti i modi: arrabbiato, felice, in spagnolo.»", "th": "¿En español? ¡Déjame escuchar!"}, {"l": "Hai fame?", "a": "«Sempre. Un attore a stomaco vuoto recita male. A stomaco pieno, si addormenta.»", "th": "Una vida difícil."}], "stella": [{"l": "Cosa fai lassù?", "a": "«Lezione! Adesso provo la goccia: mi arrotolo nel tessuto e mi lascio cadere. Non guardare, se ti impressioni.»", "th": "No miro. Bueno, un poquito."}, {"l": "Non hai paura?", "a": "«All'inizio sì. Adesso ho più paura delle scale di casa mia.»", "th": "Las escaleras. Peligrosísimas."}], "clio": [{"l": "Cosa fai lassù?", "a": "«Mi riscaldo! Vengo dal nouveau cirque: per me stare a testa in giù è come per te stare seduto.»", "th": "Yo sentado, ella al revés."}, {"l": "Hai comprato qualcosa ai mercatini?", "a": "«Una lampada degli anni Sessanta, una sciarpa del Bologna e un orologio che non funziona. Giornata perfetta.»", "th": "¡Qué tesoros!"}], "martina": [{"l": "Vai al festival Danza Urbana?", "a": "«Ci vado sempre! Danza nelle piazze, nei cortili, per strada. La danza deve stare dove sta la gente.»", "th": "Donde está la gente. ¡Me gusta!"}, {"l": "Per cosa ti stai battendo?", "a": "«Per tante cose. Stasera, per esempio, per difendere trecento polpette da tutto il teatro.»", "th": "Una causa justa."}]};for(const id in QX)if(PID[id])(PID[id].L=PID[id].L||{}).qx=QX[id];
